<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1180" viewBox="0 0 920 1180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="100%" stop-color="#121826"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="920" height="1180" fill="url(#bg)"/>

  <text x="460" y="48" text-anchor="middle" fill="#f3f4f6" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="26" font-weight="700">ai-film-grok · 四层流水线</text>
  <text x="460" y="76" text-anchor="middle" fill="#9ca3af" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Prompt → Agent → Visual → Voice → Design → FFmpeg → Deliver</text>

  <!-- helper for cards -->
  <!-- card y positions -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">

    <!-- 0 prompt -->
    <rect x="120" y="100" width="680" height="70" rx="16" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="460" y="130" text-anchor="middle" fill="#e9d5ff" font-size="16" font-weight="600">用户 Prompt / 剧本 / 参考图</text>
    <text x="460" y="152" text-anchor="middle" fill="#c4b5fd" font-size="12">任意 brief · 文本 · 小说片段 · 「帮我拍 X」</text>

    <!-- arrow -->
    <path d="M460 170 L460 190" stroke="#6b7280" stroke-width="2" fill="none"/>
    <path d="M460 190 L454 182 L466 182 Z" fill="#6b7280"/>

    <!-- agent -->
    <rect x="90" y="196" width="740" height="110" rx="16" fill="#1e1b4b" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="460" y="228" text-anchor="middle" fill="#f5d0fe" font-size="17" font-weight="700">Grok Agent · 规划层 + aifilm dispatch</text>
    <text x="460" y="252" text-anchor="middle" fill="#e9d5ff" font-size="13">Director's Lens · film-spec · style/cast lock · pilot 门禁</text>
    <text x="460" y="274" text-anchor="middle" fill="#d8b4fe" font-size="12">init · lock-style · write-spec · pilot · dispatch（每回合 next_cmd）</text>
    <text x="460" y="294" text-anchor="middle" fill="#a78bfa" font-size="11">八环: Idea → Story → Beats → Shots → Media → Selects → Rough → Verified</text>

    <path d="M460 306 L460 326" stroke="#6b7280" stroke-width="2" fill="none"/>
    <path d="M460 326 L454 318 L466 318 Z" fill="#6b7280"/>

    <!-- visual -->
    <rect x="90" y="332" width="740" height="120" rx="16" fill="#0c1a2e" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="460" y="364" text-anchor="middle" fill="#bfdbfe" font-size="17" font-weight="700">1 · 视觉生成（可插拔）</text>
    <text x="460" y="388" text-anchor="middle" fill="#93c5fd" font-size="13">静帧: Grok Imagine image_gen / image_edit · OAuth image</text>
    <text x="460" y="410" text-anchor="middle" fill="#93c5fd" font-size="13">I2V 默认 grok_primary → image_to_video · 可选 FRW Seedance / LTX 环境床</text>
    <text x="460" y="432" text-anchor="middle" fill="#7dd3fc" font-size="12">media-queue · register-clip · continue · queue-run-oauth</text>

    <path d="M460 452 L460 472" stroke="#6b7280" stroke-width="2" fill="none"/>
    <path d="M460 472 L454 464 L466 464 Z" fill="#6b7280"/>

    <!-- voice -->
    <rect x="90" y="478" width="740" height="110" rx="16" fill="#052e1c" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="460" y="510" text-anchor="middle" fill="#a7f3d0" font-size="17" font-weight="700">2 · 语音生成（可插拔）</text>
    <text x="460" y="534" text-anchor="middle" fill="#6ee7b7" font-size="13">TTS 默认 edge · 可切 voicebox / grok / minimax / fish / external</text>
    <text x="460" y="556" text-anchor="middle" fill="#6ee7b7" font-size="13">BGM 默认 rnb 池 + music-seed 程序化兜底 · Lipsync 默认 off</text>
    <text x="460" y="576" text-anchor="middle" fill="#34d399" font-size="12">tts-rehearse · tts-ab · audio-plan · capability</text>

    <path d="M460 588 L460 608" stroke="#6b7280" stroke-width="2" fill="none"/>
    <path d="M460 608 L454 600 L466 600 Z" fill="#6b7280"/>

    <!-- design -->
    <rect x="90" y="614" width="740" height="90" rx="16" fill="#2a1f06" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="460" y="646" text-anchor="middle" fill="#fde68a" font-size="17" font-weight="700">3 · 动态合成 / 图形层（可插拔）</text>
    <text x="460" y="670" text-anchor="middle" fill="#fcd34d" font-size="13">HyperFrames 优先 · Remotion 备选 · 字幕 / 标题 / 片头片尾</text>
    <text x="460" y="690" text-anchor="middle" fill="#f59e0b" font-size="12">final --post-engine hyperframes · compose-preview</text>

    <path d="M460 704 L460 724" stroke="#6b7280" stroke-width="2" fill="none"/>
    <path d="M460 724 L454 716 L466 716 Z" fill="#6b7280"/>

    <!-- ffmpeg -->
    <rect x="90" y="730" width="740" height="90" rx="16" fill="#2a0a1f" stroke="#f472b6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="460" y="762" text-anchor="middle" fill="#fbcfe8" font-size="17" font-weight="700">4 · 最终合成与后处理</text>
    <text x="460" y="786" text-anchor="middle" fill="#f9a8d4" font-size="13">FFmpeg：多镜合并 · 混音/侧链 · loudnorm · 对音 · 编码 · 导出</text>
    <text x="460" y="806" text-anchor="middle" fill="#ec4899" font-size="12">plate (subs off) · reencode · export-desktop</text>

    <path d="M460 820 L460 840" stroke="#6b7280" stroke-width="2" fill="none"/>
    <path d="M460 840 L454 832 L466 832 Z" fill="#6b7280"/>

    <!-- deliver -->
    <rect x="120" y="846" width="680" height="70" rx="16" fill="#052e1c" stroke="#2dd4bf" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="460" y="876" text-anchor="middle" fill="#99f6e4" font-size="17" font-weight="700">最终 MP4 + 预览 + 可下载资产</text>
    <text x="460" y="898" text-anchor="middle" fill="#5eead4" font-size="12">review-final 七维 · export-desktop · status.pipeline_stage</text>

    <!-- note -->
    <rect x="90" y="940" width="740" height="100" rx="14" fill="#111827" stroke="#374151" stroke-width="1"/>
    <text x="110" y="968" fill="#e5e7eb" font-size="13" font-weight="600">工程一键交付（与产品层序对齐）</text>
    <text x="110" y="990" fill="#9ca3af" font-size="12">final --post-engine hyperframes = [4] FFmpeg plate → [3] HF/Remotion → [4] 封装</text>
    <text x="110" y="1012" fill="#9ca3af" font-size="12">双烧 gate: plate-cards blank + subs off · 插拔模型矩阵见仓库根 README</text>
    <text x="110" y="1032" fill="#6b7280" font-size="11">主脊: skills/ai-film-grok/SKILL.md · hard-defaults · auto-dispatch</text>

    <text x="110" y="1100" fill="#4b5563" font-size="11">ai-film-grok · 2026-07-21 · grok_primary season</text>
    <text x="810" y="1100" text-anchor="end" fill="#4b5563" font-size="11">dispatch · next_cmd</text>
  </g>
</svg>
