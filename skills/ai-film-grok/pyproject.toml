[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E402",  # CLI/test modules deliberately amend sys.path before local imports
    "B008",  # do not perform function calls in argument defaults
    "B007",  # readable loop indices are retained where iteration context matters
    "B904",  # legacy exception messages intentionally preserve original context
    "SIM102",  # use a single if statement instead of nested if
    "SIM103",  # explicit boolean branches can carry director-policy commentary
    "SIM112",  # compatibility examples may read legacy lowercase environment names
    "SIM115",  # detached preview process owns and closes its log handle
    "SIM117",  # nested test contexts retain assertion and patch scope readability
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017", "S101"]
"scripts/adapters/*.py" = ["B008"]
"scripts/plan/film_spec.py" = ["F405"]
"scripts/plan/film_spec_lints.py" = ["F405"]
"scripts/plan/film_spec_validate.py" = ["F405"]
"scripts/plan/film_spec_validate_body.py" = ["F405"]
"scripts/plan/film_spec_validate_provider.py" = ["F405"]
"scripts/plan/film_spec_validate_soft_gates.py" = ["F405"]
"scripts/plan/film_spec_validate_heat.py" = ["F405"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
markers = [
    "hotpath: final/compose/gates fail-mode contracts",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.mypy]
mypy_path = "scripts"
explicit_package_bases = true
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
follow_imports = "silent"
# Top-level hard-compat shims dual-map as "X" and "scripts.X" under mypy_path=scripts.
# Exclude only those top-level files (package impls live under assets/ etc.).
exclude = [
    '^style_lock\.py$',
    '^face_identity\.py$',
    '^scripts/style_lock\.py$',
    '^scripts/face_identity\.py$',
]
