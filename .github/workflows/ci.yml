name: ci

env:
  PYTHON_VERSION: "3.11.15"
  PYTEST_VERSION: "9.0.3"
  COVERAGE_VERSION: "7.13.5"
  RUFF_VERSION: "0.15.10"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # Gate: packaging + spine/gates — must stay green for merge confidence
  validate-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install system tools (ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: skills/ai-film-grok/requirements.lock

      - name: Install pinned skill deps
        working-directory: skills/ai-film-grok
        run: |
          python -m pip install --upgrade pip
          pip install "pytest==${PYTEST_VERSION}"
          pip install -r requirements.lock

      - name: Secret scan (CI is final gate; local pre-push may skip)
        run: python3 scripts/secret_scan.py

      - name: Validate plugin metadata + layout + commands
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("plugin.json").read_text(encoding="utf-8"))
          for key in ("name", "version", "description"):
              assert key in data and str(data[key]).strip(), f"missing {key}"
          assert data["name"] == "ai-film-grok"
          assert Path("skills/ai-film-grok/SKILL.md").is_file()
          assert Path("skills/ai-film-grok/scripts/aifilm").is_file()
          # commands/ must contain at least one .md launcher
          cmds = sorted(Path("commands").glob("*.md"))
          assert cmds, "commands/*.md is empty"
          for c in cmds:
              assert "aifilm" in c.read_text(encoding="utf-8").lower(), f"{c.name} missing aifilm dispatch"
          # G0.4 / D7.4 · version pointer must match plugin.json
          ver = str(data["version"]).strip()
          graph = Path("docs/GRAPH.md").read_text(encoding="utf-8")
          assert ver in graph, f"docs/GRAPH.md missing plugin version {ver}; run make sync-docs"
          readme = Path("README.md").read_text(encoding="utf-8")
          assert ver in readme, f"README.md missing version {ver}; run make sync-docs"
          if "BEGIN GENERATED: project-status" in readme:
              block = readme.split("BEGIN GENERATED: project-status", 1)[1].split(
                  "END GENERATED: project-status", 1
              )[0]
              assert ver in block, f"generated project-status missing {ver}"
          print("OK", data["name"], data["version"], "cmds:", [c.name for c in cmds])
          PY

      - name: CLI and shell launcher smoke test
        run: |
          skills/ai-film-grok/scripts/aifilm --help >/dev/null
          bash -n skills/ai-film-grok/scripts/aifilm

      - name: Validate all shipped JSON schemas and registry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          schemas = sorted(Path("skills").glob("*/schemas/*.json"))
          assert schemas, "skills/*/schemas/*.json is empty"
          for path in schemas:
              json.loads(path.read_text(encoding="utf-8"))
              print("OK", path)
          reg = Path("skills/ai-film-grok/registry/skills.json")
          if reg.is_file():
              json.loads(reg.read_text(encoding="utf-8"))
              print("OK", reg)
          PY
          skills/ai-film-grok/scripts/aifilm --help >/dev/null
          skills/ai-film-grok/scripts/aifilm skill list >/dev/null

      - name: Test shipped skill and root contracts
        run: |
          python -m pytest skills/ai-film-project/tests tests/test_premium_pipeline_contracts.py -q --tb=line

      - name: Ruff lint + format check (full scripts)
        run: |
          python -m pip install "ruff==${RUFF_VERSION}"
          ruff check skills/ai-film-grok/scripts/
          ruff format --check skills/ai-film-grok/scripts/
          ruff check --config skills/ai-film-grok/pyproject.toml scripts/project_audit.py scripts/audit_lessons.py
          ruff format --check --config skills/ai-film-grok/pyproject.toml scripts/project_audit.py scripts/audit_lessons.py

      - name: aifilm doctor (schema + script fingerprint gate)
        working-directory: skills/ai-film-grok
        env:
          AIFILM_CI: "1"
        run: |
          # doctor returns 0 when core readiness is green. On CI, python patch
          # version + ffmpeg version may differ from the local machine that
          # generated runtime-lock.json — those drifts are environment-only and
          # not merge blockers. What matters on CI: script fingerprints
          # (caught source drift) + film-spec schema validity + requirements.lock.
          python scripts/aifilm doctor >/tmp/doctor.json || true
          python - <<'PY'
          import json
          d = json.load(open("/tmp/doctor.json"))
          # hard requirements (machine-independent)
          schema = d.get("film_spec_schema", {})
          assert schema.get("ok"), f"film_spec schema invalid: {schema.get('error')}"
          assert d["core_readiness"]["checks"]["film_spec_schema"], "schema check failed"
          assert d["core_readiness"]["checks"]["requirements_lock"], "requirements.lock drift"
          # script fingerprint drift = real source change not committed to lock
          rl = d.get("core_readiness", {}).get("checks", {}).get("runtime_lock", False)
          if not rl:
              errs = d.get("core_readiness", {}).get("failed_checks", [])
              # tolerate python/ffmpeg version drift on CI; fail on script fingerprint drift
              script_drift = [e for e in errs if "fingerprint" in str(e)]
              assert not script_drift, f"script fingerprint drift (run 'aifilm lock-runtime' and commit): {script_drift}"
              print("doctor: schema+deps+scripts OK (version drift tolerated on CI)")
          else:
              print("doctor: runtime_lock fully OK")
          PY

      - name: "Core pytest (fast path: all tests, excluding slow)"
        working-directory: skills/ai-film-grok
        env:
          AIFILM_CI: "1"
        run: |
          pip install "coverage==${COVERAGE_VERSION}"
          coverage run -m pytest tests/ -q --tb=line -m "not slow"
          coverage report --fail-under=58
          coverage json -o coverage.json
          python - <<'PY'
          import json
          data = json.load(open("coverage.json"))
          files = data.get("files", {})
          floors = {"media/media_qa.py": 45, "gates/quality_evidence.py": 80, "assets/continuity.py": 85}
          for name, floor in floors.items():
              row = next((value for key, value in files.items() if key.endswith(f"scripts/{name}")), None)
              assert row is not None, f"coverage row missing: {name}"
              actual = row["summary"]["percent_covered"]
              assert actual >= floor, f"{name} coverage {actual:.1f}% < {floor}%"
              print(f"coverage floor OK: {name}={actual:.1f}%")
          PY

      - name: Upload coverage trend input
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core-${{ github.sha }}
          path: skills/ai-film-grok/coverage.json
          if-no-files-found: error
          retention-days: 30

  # Fail-mode contracts: gates / final / compose (fast feedback, parallel to full)
  hotpath:
    runs-on: ubuntu-latest
    needs: validate-core
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install system tools (ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: skills/ai-film-grok/requirements.lock

      - name: Install pinned skill deps
        working-directory: skills/ai-film-grok
        run: |
          python -m pip install --upgrade pip
          pip install "pytest==${PYTEST_VERSION}"
          pip install -r requirements.lock

      - name: Hotpath pytest (fail-closed contracts)
        env:
          AIFILM_CI: "1"
        working-directory: skills/ai-film-grok
        run: python -m pytest tests/ -q --tb=line -m "hotpath and not slow"

  # Web review console: isolated gate so console regressions are caught
  # independently of the broader (occasionally flaky) suites.
  console:
    runs-on: ubuntu-latest
    needs: validate-core
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install system tools (ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: skills/ai-film-grok/requirements.lock

      - name: Install pinned skill deps
        working-directory: skills/ai-film-grok
        run: |
          python -m pip install --upgrade pip
          pip install "pytest==${PYTEST_VERSION}"
          pip install -r requirements.lock

      - name: Console pytest (web review console gate)
        env:
          AIFILM_CI: "1"
        working-directory: skills/ai-film-grok
        run: python -m pytest tests/ -q --tb=short -m console

  # Full suite: hard gate once green on main
  test-full:
    runs-on: ubuntu-latest
    needs: validate-core
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install system tools (ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: skills/ai-film-grok/requirements.lock

      - name: Install pinned skill deps
        working-directory: skills/ai-film-grok
        run: |
          python -m pip install --upgrade pip
          pip install "pytest==${PYTEST_VERSION}"
          pip install -r requirements.lock

      - name: Slow pytest partition
        env:
          AIFILM_CI: "1"
        working-directory: skills/ai-film-grok
        run: python -m pytest tests/ -q --tb=line -m "slow"

  # D7.2 · mypy seed aligned with `make type` (scoped util modules only)
  typecheck:
    runs-on: ubuntu-latest
    needs: validate-core
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: skills/ai-film-grok/requirements.lock

      - name: Install mypy + skill deps
        working-directory: skills/ai-film-grok
        run: |
          python -m pip install --upgrade pip
          pip install "mypy==1.18.2"
          pip install -r requirements.lock

      - name: make type (scoped util seed)
        run: make type

  # Aggregated merge gate (P0-3, senior-dev quality plan).
  # Make THIS job required in branch protection so validate-core + hotpath +
  # test-full must all pass before merge. It runs no tests itself — it only
  # ANDs the required suites, giving a single required-check target.
  merge-gate:
    runs-on: ubuntu-latest
    needs: [validate-core, hotpath, test-full, console, typecheck]
    if: always()
    steps:
      - name: Validate aggregated required suites
        run: |
          set -euo pipefail
          echo "merge-gate: validate-core + hotpath + test-full + console + typecheck must all be green"
          echo "Add 'merge-gate' as a required status check in branch protection."
          # Fail if any required job did not succeed (needs.*.result)
          for r in \
            "${{ needs.validate-core.result }}" \
            "${{ needs.hotpath.result }}" \
            "${{ needs.test-full.result }}" \
            "${{ needs.console.result }}" \
            "${{ needs.typecheck.result }}"
          do
            if [ "$r" != "success" ]; then
              echo "required job result=$r (want success)"
              exit 1
            fi
          done
          echo "merge-gate OK"
