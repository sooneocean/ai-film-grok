name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # Gate: packaging + spine/gates — must stay green for merge confidence
  validate-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install system tools (ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned skill deps
        working-directory: skills/ai-film-grok
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.lock

      - name: Validate plugin.json + layout
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("plugin.json").read_text(encoding="utf-8"))
          for key in ("name", "version", "description"):
              assert key in data and str(data[key]).strip(), f"missing {key}"
          assert data["name"] == "ai-film-grok"
          assert Path("skills/ai-film-grok/SKILL.md").is_file()
          assert Path("skills/ai-film-grok/scripts/aifilm").is_file()
          print("OK", data["name"], data["version"])
          PY

      - name: Core pytest (dispatch / craft / gates / capability)
        working-directory: skills/ai-film-grok
        env:
          AIFILM_CI: "1"
        run: |
          python -m pytest -q --tb=line \
            tests/test_dispatch.py \
            tests/test_craft_spine.py \
            tests/test_delivery_gates.py \
            tests/test_capability.py \
            tests/test_next_actions.py \
            tests/test_production_gates.py

  # Full suite: report debt; does not block packaging gate while legacy tests catch up
  test-full:
    runs-on: ubuntu-latest
    needs: validate-core
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install system tools (ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned skill deps
        working-directory: skills/ai-film-grok
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.lock

      - name: Full pytest suite
        working-directory: skills/ai-film-grok
        env:
          AIFILM_CI: "1"
        run: python -m pytest tests/ -q --tb=line
