name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # Gate: packaging + spine/gates — must stay green for merge confidence
  validate-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install system tools (ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned skill deps
        working-directory: skills/ai-film-grok
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.lock

      - name: Validate plugin.json + layout
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("plugin.json").read_text(encoding="utf-8"))
          for key in ("name", "version", "description"):
              assert key in data and str(data[key]).strip(), f"missing {key}"
          assert data["name"] == "ai-film-grok"
          assert Path("skills/ai-film-grok/SKILL.md").is_file()
          assert Path("skills/ai-film-grok/scripts/aifilm").is_file()
          print("OK", data["name"], data["version"])

      - name: CLI and shell launcher smoke test
        run: |
          skills/ai-film-grok/scripts/aifilm --help >/dev/null
          bash -n skills/ai-film-grok/scripts/aifilm

      - name: Validate shipped JSON schemas and registry
        working-directory: skills/ai-film-grok
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [Path("schemas/drama-graph.schema.json"), Path("registry/skills.json")]:
              json.loads(path.read_text(encoding="utf-8"))
              print("OK", path)
          PY
          python scripts/aifilm skill list >/dev/null

      - name: Ruff lint + format check (full scripts)
        run: |
          python -m pip install ruff
          ruff check skills/ai-film-grok/scripts/
          ruff format --check skills/ai-film-grok/scripts/

      - name: Core pytest (fast path: all tests, excluding slow)
        working-directory: skills/ai-film-grok
        env:
          AIFILM_CI: "1"
        run: |
          python -m pytest tests/ -q --tb=line -m "not slow"

  # Full suite: hard gate once green on main
  test-full:
    runs-on: ubuntu-latest
    needs: validate-core
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install system tools (ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned skill deps
        working-directory: skills/ai-film-grok
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.lock

      - name: Full pytest suite
        working-directory: skills/ai-film-grok
        env:
          AIFILM_CI: "1"
        run: python -m pytest tests/ -q --tb=line
